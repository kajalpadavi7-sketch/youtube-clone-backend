spring.application.name=backend

# ==========================================
# LOCAL DATABASE CONFIGURATION (PostgreSQL)
# ==========================================
# Agar aap apne computer ka local PostgreSQL use kar rahi hain:
spring.datasource.url=jdbc:postgresql://localhost:5432/youtube_clone
spring.datasource.username=postgres
spring.datasource.password=root123
spring.datasource.driver-class-name=org.postgresql.Driver

# NOTE: Agar aap abhi bhi online Neon Database hi use karna chahti hain, 
# toh upar ki 3 lines ko hata kar apni purani Neon database wali lines paste kar dena.

# ==========================================
# JPA / HIBERNATE SETTINGS
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# FILE UPLOAD SETTINGS (Local Directories)
# ==========================================
file.upload.path=upload
file.upload.video=upload/videos/
file.upload.thumbnail=upload/thumbnails/

# ==========================================
# SECURITY / JWT CONFIGURATION
# ==========================================
jwt.secret=VGhpc0lzTXlTdXBlclNlY3JldEtleUZvckpXVDEyMzQ1Njc4OTAxMjM0NTY3ODkw
jwt.expiration=86400000

# ==========================================
# SERVER & LOGGING CONFIGURATION
# ==========================================
# Localhost par chalane ke liye sirf port 8080 define kiya hai

server.address=0.0.0.0
server.port=8080

logging.level.org.springframework.security=DEBUG


# Maximum file size allowance (500MB)
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB